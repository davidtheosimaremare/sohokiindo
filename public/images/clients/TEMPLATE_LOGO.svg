<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80">
  <!-- Panduan Template Kanvas Logo Hokiindo -->
  <!-- Background transparan (border dashed hanya untuk panduan) -->
  <rect x="1" y="1" width="238" height="78" rx="8" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />
  
  <!-- Safe Zone Area (Rekomendasi area logo agar terlihat proporsional) -->
  <rect x="20" y="15" width="200" height="50" rx="4" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 2" />
  
  <text x="120" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">SAFE ZONE LOGO</text>
  <text x="120" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">240 x 80 px (Format PNG Transparan / SVG)</text>
</svg>
